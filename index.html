html, body { height: 100%; margin: 0; }

.seg { display: flex; gap: 2px; background: var(--bg2); padding: 2px; border-radius: 6px; flex: none; }
.seg button { padding: 4px 10px; border-radius: 4px; color: var(--t2); }
.seg button.on { background: #fff; color: #18181b; font-weight: 600; }
.lnk { color: var(--t2); text-decoration: underline; white-space: nowrap; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
body.no-side .main { grid-template-columns: minmax(0, 1fr); }
body.no-side .side { display: none; }
.stage { position: relative; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding: 12px; min-width: 0; }
.frame-box { background: #fff; box-shadow: 0 0 0 1px rgba(24,24,27,.16); transform-origin: top center; flex: none; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
.scale { position: absolute; right: 16px; bottom: 12px; background: var(--bg); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.side { background: var(--bg); overflow: auto; padding: 12px; }
.side h2 { font-size: 11px; line-height: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--t3); margin: 16px 0 8px; font-weight: 600; }
.side h2:first-child { margin-top: 0; }
.ctl { display: grid; gap: 4px; }
.ctl button.act { text-align: left; padding: 6px 8px; border-radius: 4px; background: var(--bg2); color: var(--t); }
.ctl button.act:hover { background: var(--line); }
.tgl { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 4px; background: var(--bg2); cursor: pointer; }
.tgl input { accent-color: #fb3939; margin: 0; }
.sel { width: 100%; background: var(--bg2); color: var(--t); border: 0; padding: 6px; border-radius: 4px; font: inherit; }
.ann { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.ann li { padding: 8px; border-radius: 4px; background: var(--bg2); color: var(--t2); }
.ann b { color: var(--t); font-weight: 600; display: block; }
.ann .ref { display: block; margin-top: 2px; color: var(--t3); font-size: 12px; line-height: 16px; }
.ann li.dev { border-left: 2px solid #eeb250; }
.ann li.dev::before { content: 'Для разработки'; display: block; color: #eeb250; font-size: 11px; line-height: 16px; font-weight: 600; }
.side-x { display: none; margin-bottom: 8px; }

@media (max-width: 640px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  body.side-open .side { display: block; position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 100%); z-index: 30; }
  .side-x { display: block; }

    ['Почта прямо в окне', 'Подтверждаем почту кодом в окне ставки, потому что в профиле нужной кнопки нет', 'Поддержка: 42 обращения. Для разработки', 1],
    ['Обсуждение и описание', 'Дали лоту те же описание, характеристики и обсуждение, что и карточке товара', 'UX'],
    ['Завершённый лот из торгов', 'Не показываем поле ставки, если лот открыт из завершённых торгов', 'Обратная связь пользователя'],

    ['Резерв', 'Единый статус «Резерв не достигнут» вместо письма о победе и отмены', 'Поддержка'],
  ],
  bids: [
    ['Метка о незавершённом', 'Показываем счётчик в меню профиля и ЛК, пока выигранный лот не оформлен, чтобы не пропустить срок 48 часов и штраф', 'Поддержка. CJM 3'],

  ],
};

const HINTS = {
  catalog: ['Работают цена, город, оригинальность, состояние, материал, комплектация, категории и поиск. «Продавец» и «Безопасность» только запоминаются: таких данных у лотов нет', 'Лотов 19, поэтому «по 48» и «по 96» выдачу не меняют'],
  item: ['Выберите, кто смотрит, выше: форма обсуждения, подписка и жалоба есть только после входа. Продавец это PocketSized Prints, его лот Strudd Panzermensh', 'Отзывы о товаре и теги примерные: отзывы взяты из отзывов о продавце, теги подобраны вручную'],
  lk: ['Выберите «Вошёл, покупатель» в блоке «Кто смотрит»: без входа ЛК просит войти'],
  lot: ['Код подтверждения почты 1234', 'Свой аукцион виден при роли продавца'],
  bids: ['Выберите «Вошёл, покупатель» в блоке «Кто смотрит»'],
  checkout: ['Промокод MINI10, сертификат GIFT500. Любой другой покажет ошибку', 'Наличные видны только при самовывозе'],
  success: ['Состояния «Email есть в базе» и «Автоподтверждение у PRO» переключаются выше'],
};

const LOTS = [['live', 'Идут торги'], ['lead', 'Вы лидируете'], ['outbid', 'Ставку перебили'], ['auto', 'Есть автоставка'], ['won', 'Вы выиграли'], ['lost', 'Выиграл другой'], ['reserve', 'Резерв не достигнут'], ['ended', 'Завершён без ставок']];
const ROLES = [['guest', 'Не вошёл'], ['buyer', 'Вошёл, покупатель'], ['seller', 'Вошёл, продавец своего лота']];

const CTRLS = {
  home: [],
  catalog: [],
  lk: [{ t: 'go', l: 'Открыть заказ', h: '#/lk/order/464811' }, { t: 'go', l: 'Заказ с безопасной сделкой', h: '#/lk/order/464808' }, { t: 'go', l: 'Смена доставки и отмена после оплаты', h: '#/lk/order/464806?demo=change-order' }, { t: 'flag', k: 'noOrders', l: 'Нет заказов' }, { t: 'flag', k: 'minus', l: 'Минус на балансе' }, { t: 'flag', k: 'rcFail', l: 'Сбой загрузки чека' }, { t: 'msg', m: { type: 'mfm-rc', value: 'ok' }, l: 'Окно оплаты: файл выбран' }, { t: 'msg', m: { type: 'mfm-rc', value: 'big' }, l: 'Окно оплаты: файл больше 20 МБ' }, { t: 'msg', m: { type: 'mfm-rc', value: 'bad' }, l: 'Окно оплаты: неверный формат' }],
  lot: [{ t: 'lot' }, { t: 'flag', k: 'noEmail', l: 'Почта не подтверждена' }, { t: 'flag', k: 'minus', l: 'Минус на балансе' }, { t: 'go', l: 'Открыть свой аукцион', h: '#/lot/a-own' }, { t: 'go', l: 'Лот с резервом', h: '#/lot/a-leman' }, { t: 'go', l: 'Лот с блиц-ценой', h: '#/lot/a-guilliman' }],
  bids: [{ t: 'flag', k: 'noBids', l: 'Не участвовал в торгах' }],
  item: [{ t: 'flag', k: 'soldOut', l: 'Нет в наличии' }],
  cart: [{ t: 'preset', n: 'empty', l: 'Пустая корзина' }, { t: 'preset', n: 'one', l: 'Один продавец' }, { t: 'preset', n: 'two', l: 'Два продавца' }, { t: 'preset', n: 'three', l: 'Три товара у двух продавцов' }, { t: 'flag', k: 'itemOut', l: 'Товар закончился' }, { t: 'flag', k: 'partial', l: 'Остаток меньше выбранного' }, { t: 'flag', k: 'minSum', l: 'Минимальная сумма продавца' }],
  checkout: [{ t: 'fill', l: 'Заполнить форму' }, { t: 'empty', l: 'Отправить пустую форму' }, { t: 'preset', n: 'two', l: 'Два продавца' }, { t: 'preset', n: 'cash', l: 'Самовывоз: есть наличные' }, { t: 'select', k: 'fail', l: 'Ответ сервера', o: [['none', 'Заказ создан'], ['changed', 'Сумма изменилась'], ['out', 'Товар закончился'], ['balance', 'Отрицательный баланс']] }],
  success: [{ t: 'flag', k: 'emailExists', guest: true, l: 'Email уже есть в базе' }, { t: 'flag', k: 'autoConfirm', l: 'Автоподтверждение у PRO' }],
};

const $ = (s) => document.querySelector(s);
const f = $('#f'), box = $('#box'), stage = $('#stage'), scaleEl = $('#scale');
let st = { route: 'home', flags: {} };
let width = 1440;
try { const w = localStorage.getItem('mfm-width'); if (w !== null) width = +w; } catch (e) { /* без хранилища */ }
const send = (m) => f.contentWindow.postMessage(m, '*');
const nb = (s) => s.replace(/(^|[\s(«—])(а|в|во|и|к|о|об|от|до|по|за|из|на|не|но|с|со|у|для|без|или|что)\s/gi, '$1$2 ');

function layout() {
  const aw = stage.clientWidth - 24, ah = stage.clientHeight - 24;
  if (!width) { box.style.cssText = `width:${aw}px;height:${ah}px`; scaleEl.hidden = true; return; }
  const s = Math.min(1, aw / width);
  box.style.cssText = `width:${width}px;height:${Math.round(ah / s)}px;transform:scale(${s})`;
  scaleEl.hidden = s === 1; scaleEl.textContent = Math.round(s * 100) + '%';
}
const orderRoutes = ['cart', 'checkout', 'success'];
function stepButton(k, l, active) {
  return `<button data-s="${k}" aria-pressed="${active}" class="${active ? 'on' : ''}">${l}</button>`;
}
function drawTop() {
  $('#steps').innerHTML = STEPS.filter(([k]) => !orderRoutes.includes(k) || k === 'cart').map(([k, l]) =>
    k === 'cart' ? stepButton('cart', 'Корзина и оформление', orderRoutes.includes(st.route)) : stepButton(k, l, st.route === k)
  ).join('');
  const inside = orderRoutes.includes(st.route);
  $('#orderSteps').hidden = !inside;
  $('#orderSteps').innerHTML = inside ? STEPS.filter(([k]) => orderRoutes.includes(k)).map(([k, l]) => stepButton(k, l, st.route === k)).join('') : '';
  $('#widths').innerHTML = WIDTHS.map(([w, l]) => `<button data-w="${w}" class="${width === w ? 'on' : ''}">${l}</button>`).join('');
}
function drawSide() {
  const c = (CTRLS[st.route] || []).filter((x) => !x.guest || !st.flags.role || st.flags.role === 'guest');
  const n = NOTES[st.route] || [];
  const hints = HINTS[st.route] || [];
  const ctl = c.map((x) => {
    if (x.t === 'flag') return `<label class="tgl"><span>${x.l}</span><input type="checkbox" data-flag="${x.k}" ${st.flags[x.k] ? 'checked' : ''}></label>`;
    if (x.t === 'preset') return `<button class="act" data-preset="${x.n}">${x.l}</button>`;
    if (x.t === 'msg') return `<button class="act" data-msg='${JSON.stringify(x.m)}'>${x.l}</button>`;
    if (x.t === 'go') return `<button class="act" data-go="${x.h}">${x.l}</button>`;
    if (x.t === 'lot') return `<label>Состояние лота<select class="sel" data-lot style="margin-top:4px">${LOTS.map(([v, t]) => `<option value="${v}" ${(st.lotSt || 'live') === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
    if (x.t === 'fill') return `<button class="act" data-fill>${x.l}</button>`;
    if (x.t === 'empty') return `<button class="act" data-empty>${x.l}</button>`;
    if (x.t === 'select') return `<label>${x.l}<select class="sel" data-sel="${x.k}" style="margin-top:4px">${x.o.map(([v, t]) => `<option value="${v}" ${st.flags[x.k] === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
    return '';
  }).join('');
  const roles = ROLES.map(([v, t]) => `<option value="${v}" ${(st.flags.role || 'guest') === v ? 'selected' : ''}>${t}</option>`).join('');
  $('#side').innerHTML = `<button class="lnk side-x" id="sideClose">Скрыть панель</button><h2>Кто смотрит</h2><select class="sel" data-sel="role" aria-label="Кто смотрит">${roles}</select>${ctl ? `<h2>Состояния</h2><div class="ctl">${ctl}</div>` : ''}
    <h2>Что изменили и почему</h2>
    <ul class="ann">${n.map(([a, b, r, dev]) => `<li class="${dev ? 'dev' : ''}"><b>${nb(a)}</b>${nb(b)}${r ? `<span class="ref">${r}</span>` : ''}</li>`).join('')}</ul>
    ${hints.length ? `<h2>Как проверить</h2><ul class="ann">${hints.map((t) => `<li>${nb(t)}</li>`).join('')}</ul>` : ''}
    <h2>Прототип</h2><div class="ctl"><button class="act" data-reset>Начать сценарий заново</button></div>`;
}
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'mfm-state') return;
  const changed = e.data.route !== st.route || JSON.stringify(e.data.flags) !== JSON.stringify(st.flags) || e.data.lotSt !== st.lotSt;
  st = e.data; drawTop(); if (changed) drawSide();
});
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.dataset.s) { const s = STEPS.find(([k]) => k === t.dataset.s); send({ type: 'mfm-go', hash: s[2] }); }
  if (t.dataset.w !== undefined) { width = +t.dataset.w; try { localStorage.setItem('mfm-width', width); } catch (e2) { /* без хранилища */ } drawTop(); layout(); }
  if (t.dataset.msg) send(JSON.parse(t.dataset.msg));
  if (t.dataset.go) send({ type: 'mfm-go', hash: t.dataset.go });
  if (t.dataset.preset) send({ type: 'mfm-preset', name: t.dataset.preset });
  if ('fill' in t.dataset) send({ type: 'mfm-fill' });
  if ('empty' in t.dataset) send({ type: 'mfm-empty-submit' });
  if ('reset' in t.dataset) send({ type: 'mfm-reset' });
  if (t.id === 'sideBtn') { document.body.classList.toggle(window.innerWidth <= 640 ? 'side-open' : 'no-side'); layout(); }
  if (t.id === 'sideClose') document.body.classList.remove('side-open');
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if ('lot' in t.dataset) send({ type: 'mfm-lot', value: t.value });
  if (t.dataset.flag) send({ type: 'mfm-flag', key: t.dataset.flag, value: t.checked });
  if (t.dataset.sel) send({ type: 'mfm-flag', key: t.dataset.sel, value: t.value });
});
window.addEventListener('resize', layout);
drawTop(); drawSide(); layout();
</script>
</body>
</html>
